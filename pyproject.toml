[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crux-cli"
version = "0.1.0"
description = "CRUX — Credential Runtime Unified eXecutor. Securely inject credentials into any AI tool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["credentials", "security", "ai", "cli", "secrets", "injection"]
authors = [
    { name = "Akash Bhujbal", email = "akashbhujbal100@gmail.com" }
]

dependencies = [
    "typer>=0.12.0,<1.0.0",
    "rich>=13.0.0",
    "cryptography>=42.0.0,<51.0.0",
    "keyring>=25.0.0,<26.0.0",
    "secretstorage>=3.3.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
crux = "crux.main:app"

[project.urls]
Homepage = "https://github.com/akashbhujbalwebsite/crux"
Issues   = "https://github.com/akashbhujbalwebsite/crux/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["crux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
